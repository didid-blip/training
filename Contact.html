<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact us</title>
</head>
<body>
    <div>
        <!-- making form -->
         <center><h1><u>PLACE YOUR ORDER</u></h1></center>
         <form>
        <Label>Name:</Label>
        <input type="text" name="Name" placeholder="Enter your name"required><br><br>
        <label>Email:</label>
        <input type="email" name="email" placeholder="Enter your email"required><br><br>
        <label>Phone Number:</label>
        <input type="number" name="Phone number" placeholder="Enter your phone number"required><br><br>
        <label>Gender:</label>
        <input type="radio" name="Gender" value="male">Male
        <input type="radio" name="Gender" value="female">Female
        <input type="radio" name="Gender" value="others">Others <br><br>
        <label>Select Products:</label>
        <select name="Select Products">
            <option>Products</option>
            <option>Printed Kurti</option>
            <option>Denim Shirt</option>
            <option>Summer Dress</option>
            <option>T-Shirt</option>
            <option>Hoodie</option>
        </select><br><br>
        <label>Select Size:</label>
        <input type="radio" name="Select Size" value="Small">Small
        <input type="radio" name="Select Size" value="Medium">Medium
        <input type="radio" name="Select Size" value="Large">Large
        <input type="radio" name="Select Size" value="Extra Large">Extra Large <br><br>
        <label>Choose Colour:</label>
        <select name="Choose Colour">
        <option>Colours</option>
        <option>Blue</option>
        <option>Pink</option>
        <option>Black</option>
        <option>Grey</option>
        <option>Yellow</option>
        <option>White</option></select><br><br>
        <label>Message/Feedback:</label><br>
        <textarea name="Message/Feedback" rows="10" cols="100"></textarea><br><br>
        <button>Submit</button>
         </form>
    </div>
    
</body>
</html>
